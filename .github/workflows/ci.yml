name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

jobs:
  ruff:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "latest"
      - run: uv sync --group dev
      - name: Ruff check
        run: uv run ruff check src/ tests/ scripts/
      - name: Ruff format
        run: uv run ruff format --check src/ tests/ scripts/

  mypy:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "latest"
      # Pinned to the oldest supported version, which is also mypy's configured
      # python_version. The two have to agree: numpy ships version-conditional
      # stubs, so checking a 3.12 environment against a 3.11 target makes mypy
      # reject numpy's own `type` statements as invalid syntax. Runtime support
      # for newer versions is covered by the pytest matrix instead.
      - run: uv sync --group dev --python 3.11
      - name: Mypy
        run: uv run --python 3.11 mypy src/

  pytest:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "latest"
      - run: uv sync --group dev --python ${{ matrix.python-version }}
      - name: Pytest
        run: uv run pytest tests/ -q

  package:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "latest"
      - name: Build distributions
        run: uv build
      - name: Check package metadata
        run: uvx twine check --strict dist/*
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/*

  docker:
    permissions:
      contents: read
    name: Sidecar image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build
        run: docker build -t dead-air:ci .
      - name: CLI smoke test
        run: docker run --rm dead-air:ci --version

  compose:
    permissions:
      contents: read
    name: Compose file is valid
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Catches a malformed compose file without needing GPUs to start it.
      - run: docker compose -f compose.yaml config --quiet

  smoke:
    permissions:
      contents: read
    name: Probe against the mock target
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "latest"
      - run: uv sync --group dev
      - name: Probe, gate and drill
        run: |
          uv run python scripts/make_tone_prompts.py --out smoke/tones
          uv run deadair mock --port 18766 > smoke/mock.log 2>&1 &
          mock_pid=$!
          # Stop the mock before the job ends, or it holds the uv cache open
          # and setup-uv's post-job cleanup fails.
          trap 'kill "$mock_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 50); do
            python -c 'import socket; socket.create_connection(("127.0.0.1", 18766), 1).close()' && break
            sleep 0.2
          done
          url=ws://127.0.0.1:18766/v1/realtime
          uv run deadair probe --url "$url" --prompts smoke/tones --concurrency 2 --turns 4 --out smoke/latency \
            --budget "completion_rate>=1" --budget "protocol_violations<=0" --budget "perceived_ttfa:p95<=1500"
          uv run deadair probe --url "$url" --prompts smoke/tones --turns 3 --warmup 0 --barge-in-after 0.05 \
            --out smoke/barge-in --budget "barge_in:p95<=500" --budget "protocol_violations<=0"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: smoke-reports
          path: smoke/

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

jobs:
  ruff:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "latest"
      - run: uv sync --group dev
      - name: Ruff check
        run: uv run ruff check src/ tests/ scripts/
      - name: Ruff format
        run: uv run ruff format --check src/ tests/ scripts/

  mypy:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "latest"
      - run: uv sync --group dev
      - name: Mypy
        run: uv run mypy src/

  pytest:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "latest"
      - run: uv sync --group dev --python ${{ matrix.python-version }}
      - name: Pytest
        run: uv run pytest tests/ -q

  package:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "latest"
      - name: Build distributions
        run: uv build
      - name: Check package metadata
        run: uvx twine check --strict dist/*
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/*

  docker:
    permissions:
      contents: read
    name: Sidecar image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build
        run: docker build -t dead-air:ci .
      - name: CLI smoke test
        run: docker run --rm dead-air:ci --version

  compose:
    permissions:
      contents: read
    name: Compose file is valid
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Catches a malformed compose file without needing GPUs to start it.
      - run: docker compose -f compose.yaml config --quiet
